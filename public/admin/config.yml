backend:
  name: github
  repo: nicholasrichard9/burrow-and-butter
  branch: master

media_folder: "src/assets/images"
public_folder: "../../assets/images"

collections:
  - name: "recipes"
    label: "Recipes"
    folder: "src/content/recipes"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Author"
        name: "author"
        widget: "select"
        options: ["nick", "xavier"]
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string" }
      - { label: "Prep Time (minutes)", name: "prepTime", widget: "number" }
      - { label: "Cook Time (minutes)", name: "cookTime", widget: "number" }
      - { label: "Servings", name: "servings", widget: "number" }
      - { label: "Servings Unit", name: "servingsUnit", widget: "string", default: "servings" }
      - label: "Ingredients"
        name: "ingredients"
        widget: "list"
        fields:
          - { label: "Group (optional)", name: "group", widget: "string", required: false }
          - { label: "Item", name: "item", widget: "string" }
          - { label: "Amount", name: "amount", widget: "string" }
          - { label: "Unit", name: "unit", widget: "string", required: false }
          - { label: "Notes", name: "notes", widget: "string", required: false }
      - label: "Steps"
        name: "steps"
        widget: "list"
        fields:
          - { label: "Instruction", name: "instruction", widget: "text" }
          - { label: "Tip (optional)", name: "tip", widget: "string", required: false }
      - { label: "Notes", name: "notes", widget: "text", required: false }
      - { label: "Testing Notes", name: "testingNotes", widget: "text", required: false }
      - { label: "Chef Tip", name: "chefTip", widget: "text", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Breakfast", "Lunch", "Dinner", "Desserts", "Appetizers", "Sides", "Drinks", "Snacks"]
      - { label: "Cuisine", name: "cuisine", widget: "string" }
      - label: "Difficulty"
        name: "difficulty"
        widget: "select"
        options: ["easy", "medium", "challenging"]
      - { label: "Keywords", name: "keywords", widget: "list" }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "reviews"
    label: "Restaurant Reviews"
    folder: "src/content/reviews"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Restaurant Name", name: "restaurantName", widget: "string" }
      - { label: "City", name: "city", widget: "string" }
      - { label: "State", name: "state", widget: "string" }
      - { label: "Address", name: "address", widget: "string" }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Cuisine", name: "cuisine", widget: "string" }
      - label: "Price Range"
        name: "priceRange"
        widget: "select"
        options: ["$", "$$", "$$$", "$$$$"]
      - { label: "Visit Date", name: "visitDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Reviewer"
        name: "reviewer"
        widget: "select"
        options: ["nick", "xavier"]
      - { label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5 }
      - label: "Dishes Ordered"
        name: "dishesOrdered"
        widget: "list"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Price", name: "price", widget: "string" }
          - { label: "Recommended", name: "recommended", widget: "boolean", default: false }
      - { label: "Pros", name: "pros", widget: "list" }
      - { label: "Cons", name: "cons", widget: "list" }
      - { label: "Verdict", name: "verdict", widget: "text" }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string" }
      - { label: "Paid for Meal", name: "paid", widget: "boolean", default: true }
      - { label: "Any Part Comped", name: "comped", widget: "boolean", default: false }
      - { label: "Sponsored", name: "sponsored", widget: "boolean", default: false }
      - { label: "Description (SEO)", name: "description", widget: "text" }
      - { label: "Keywords", name: "keywords", widget: "list" }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "essays"
    label: "Essays"
    folder: "src/content/essays"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Author"
        name: "author"
        widget: "select"
        options: ["nick", "xavier"]
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string" }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Keywords", name: "keywords", widget: "list" }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "features"
    label: "Chef vs Home Cook"
    folder: "src/content/features"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Dish Name", name: "dishName", widget: "string" }
      - { label: "Hero Image", name: "heroImage", widget: "image" }
      - { label: "Hero Image Alt Text", name: "heroImageAlt", widget: "string" }
      - label: "Chef Version"
        name: "chefVersion"
        widget: "object"
        fields:
          - { label: "Author", name: "author", widget: "hidden", default: "xavier" }
          - { label: "Approach", name: "approach", widget: "text" }
          - { label: "Time", name: "time", widget: "string" }
          - { label: "Difficulty", name: "difficulty", widget: "select", options: ["easy", "medium", "challenging"] }
          - { label: "Special Equipment", name: "specialEquipment", widget: "list" }
          - { label: "Key Techniques", name: "keyTechniques", widget: "list" }
      - label: "Home Cook Version"
        name: "homeCookVersion"
        widget: "object"
        fields:
          - { label: "Author", name: "author", widget: "hidden", default: "nick" }
          - { label: "Approach", name: "approach", widget: "text" }
          - { label: "Time", name: "time", widget: "string" }
          - { label: "Difficulty", name: "difficulty", widget: "select", options: ["easy", "medium", "challenging"] }
          - { label: "Shortcuts", name: "shortcuts", widget: "list" }
          - { label: "Substitutions", name: "substitutions", widget: "list" }
      - { label: "Verdict", name: "verdict", widget: "text" }
      - { label: "Keywords", name: "keywords", widget: "list" }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
